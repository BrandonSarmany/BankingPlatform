spring.application.name=BankingPlatform
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=BankingPlatform;encrypt=true;trustServerCertificate=true
spring.datasource.username=banking_app
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
